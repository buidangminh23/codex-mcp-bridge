name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # The whole point: this is what lets npm verify the workflow's identity, and
  # it replaces the access token this repository would otherwise have to store.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Not interchangeable with 22. Trusted publishing needs npm 11.5.1 or
          # newer, and Node 22 still bundles npm 10.9.x - Node 24 ships 11.x.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Fail early when npm is too old for trusted publishing
        run: |
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need, which trusted publishing requires"
            exit 1
          fi
          echo "npm $have"

      - run: npm ci
      - run: npm test

      - name: Fail early when the tag and package.json disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. npm authenticates the OIDC token minted above, and
      # attaches provenance by itself - the --provenance flag is not needed.
      - run: npm publish
