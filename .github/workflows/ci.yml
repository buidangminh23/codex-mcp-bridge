name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  telemetry-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env supabase/functions/bridge-usage/contract-check.ts
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os != 'Windows'
      - run: npm test -- --test-concurrency=2
        if: runner.os == 'Windows'
