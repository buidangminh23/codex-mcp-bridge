name: Repository analytics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: repository-analytics
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    outputs:
      incomplete: ${{ steps.refresh.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh and publish aggregate statistics
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ANALYTICS_TOKEN || github.token }}
        run: node scripts/refresh-hosted-analytics.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-analytics
      - uses: actions/deploy-pages@v4
        id: deployment

  report:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report incomplete collection
        if: needs.refresh.outputs.incomplete == 'true'
        run: |
          echo "::error::One or more analytics sources were not refreshed; see the refresh job warnings. The Pages deployment itself succeeded with retained data."
          exit 1
