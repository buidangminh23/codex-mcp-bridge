name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # The whole point: this is what lets npm verify the workflow's identity, and
  # it replaces the access token this repository would otherwise have to store.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Not interchangeable with 22. Trusted publishing needs npm 11.5.1 or
          # newer, and Node 22 still bundles npm 10.9.x - Node 24 ships 11.x.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Fail early when npm is too old for trusted publishing
        run: |
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need, which trusted publishing requires"
            exit 1
          fi
          echo "npm $have"

      - run: npm ci
      - run: npm test

      - name: Fail early when the tag and package.json disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi

      # A tag can be pushed for a version that was already published by hand -
      # the first release of a name has to be, since npm will not configure a
      # trusted publisher for a package that does not exist yet. Publishing over
      # it is refused by the registry, so check first and skip rather than fail:
      # a red run for an expected state teaches everyone to ignore red runs.
      - name: Check whether this version is already on npm
        id: published
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$pkg@$ver is already on npm - nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$pkg@$ver is not on npm yet"
          fi

      # No NODE_AUTH_TOKEN. npm authenticates the OIDC token minted above, and
      # attaches provenance by itself - the --provenance flag is not needed.
      - run: npm publish
        if: steps.published.outputs.already == 'false'

  # A tag is not a release. Pushing v1.10.1, v1.11.0 and v1.11.1 published all
  # three to npm and left the Releases page showing v1.10.0 as Latest - the one
  # release that had been created by hand. Anyone reading the repository saw a
  # project that had not shipped in days. Creating it here means the release
  # exists whenever the tag does, instead of depending on somebody remembering.
  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Only this job may write to the repository. The publish job keeps the
    # read-only default, so the token that talks to npm cannot create refs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The notes are the changelog entry that was already written by hand.
      # Generated commit lists say what changed; the entry says why it mattered.
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "$TAG already has a release - nothing to do"
            exit 0
          fi
          node scripts/release-notes.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
